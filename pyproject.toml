[project]
name = "rag-assistant"
version = "0.1.0"
description = "Agent conversationnel RAG pour la vulgarisation des connaissances en durabilité agroalimentaire (projet COCOACERT)"
readme = "README.md"
authors = [
    { name = "BANCE BOUKARE", email = "banceboukare0700@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.18",
    "langchain>=1.3.2",
    "langchain-anthropic>=1.7.6",
    "langchain-chroma>=1.1.0",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-voyageai>=0.4.1",
    "langsmith>=0.14.11",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F : erreurs et imports inutilisés, I : tri des imports (remplace isort)
select = ["E", "F", "I"]
# Longueur des lignes : gérée par `ruff format` (les longs commentaires restent tolérés)
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
