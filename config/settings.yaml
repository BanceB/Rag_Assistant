# Réglages de l'agent RAG.
# Tout ce qui peut changer d'une expérience à l'autre vit ici, pas dans le code.
# Les secrets (clés API) restent dans .env, jamais dans ce fichier.

# Filière traitée. Sert aussi de namespace dans la base vectorielle :
# une autre filière (café, karité...) = un autre namespace, sans toucher au code.
filiere: cacao

llm:
  provider: anthropic
  model: claude-sonnet-5-5        # décision D2 : rédige les réponses
  model_rapide: claude-haiku-5-5  # reformule les questions de suivi (étape 8)
  temperature: 0.2                # bas = réponses factuelles et stables
  max_tokens: 1024

embeddings:
  provider: voyageai
  model: voyage-4                 # décision D3 : multilingue annoncé par l'éditeur

vectorstore:
  provider: chroma                # décision D4 : base locale (souveraineté, coût nul)
  persist_directory: data/chroma  # dossier où Chroma enregistre ses fichiers (ignoré par Git)
  # Pour revenir à Pinecone : provider: pinecone, et INDEX_NAME + PINECONE_API_KEY dans .env

chunking:
  chunk_size: 2000                # en caractères (environ 500 tokens)
  chunk_overlap: 200

retrieval:
  k: 4                            # passages donnés au LLM
  fetch_k: 20                     # candidats récupérés avant reranking
  seuil_score: null               # fixé à l'étape 6, à partir des mesures

memoire:
  fenetre_messages: 6

chemins:
  corpus: data/corpus
  catalogue: data/corpus_catalogue.csv
  base_sqlite: data/app.db
  logs: logs
  questions_eval: eval/questions.jsonl
